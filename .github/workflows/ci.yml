name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Validate dry-run commands
        run: |
          python -m scripts.prepare --dry-run --text-only
          python -m scripts.convert --dry-run
          python -m scripts.imatrix --dry-run
          python -m scripts.quantize --dry-run
          python -m scripts.benchmark --dry-run
          python -m scripts.smoke --help
      - name: Check patch whitespace
        run: git diff --check
